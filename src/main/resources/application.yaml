server:
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path: /ecommerce

spring:
  profiles:
    active: local
  application:
    name: E-commerce
  datasource:
    url: jdbc:mysql://localhost:3306/Ecommerce?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  # Cấu hình giới hạn upload file
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

jwt:
  signerKey: "huusang-ecommerce-secret-key-must-be-at-least-32-characters-long"

# ─── Cấu hình lưu file local ──────────────────────────────────────────────────
# ${user.dir} = thư mục gốc project (ngang hàng với src), KHÔNG lưu vào resources
file:
  upload-dir: ${user.dir}/uploads

# ─── Cấu hình GHN (Giao Hàng Nhanh) ──────────────────────────────────────────






